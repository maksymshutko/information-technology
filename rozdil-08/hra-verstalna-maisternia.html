<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script>/*clean-url*/(function(){if(location.protocol==="file:")return;var p=location.pathname,q=p.replace(/\/index\.html$/,"/").replace(/\.html$/,"");if(q!==p)history.replaceState(null,"",q+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гра: Верстальна майстерня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1340;--bg:#fff7ea;--muted:#5d5880;--ok:#17b26a;--bad:#f04438;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:clamp(16px,1.45vw,32px);line-height:1.35;overflow:hidden;
  background-image:radial-gradient(circle at 6% 12%,#ffd9e4 0,transparent 24%),radial-gradient(circle at 95% 14%,#d6e8ff 0,transparent 24%),radial-gradient(circle at 85% 90%,#dcf7ea 0,transparent 22%)}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:1.1vh 1.5vw 1.8vh;gap:1.1vh}

/* шапка */
.top{display:flex;align-items:center;gap:1.1vw;flex:none}
.logo{flex:none;background:var(--ink);border-radius:.7em;padding:.35em .8em;box-shadow:.25em .25em 0 #ffc94a;display:flex}
.logo img{height:2.2em;width:auto;display:block}
.ttl{font-weight:800;font-size:1.15em;line-height:1.1}
.ttl small{display:block;font-weight:600;font-size:.6em;color:var(--muted)}
.sp{flex:1}
.pill{background:#fff;border:.15em solid var(--ink);border-radius:99px;padding:.12em .8em;font-weight:700;white-space:nowrap;font-size:.8em}
.score{background:var(--ink);color:#ffc94a}
.streak{background:#ffc94a;visibility:hidden}
.streak.on{visibility:visible;animation:pop .35s}
.tbtn{border:.15em solid var(--ink);background:#fff;border-radius:.7em;padding:.1em .7em;font-weight:700;font-size:.78em}
.tbtn:hover{background:#ffc94a}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.1vh;animation:fade .3s}
.center{align-items:center;justify-content:center;text-align:center}

/* вітальня й карта місій */
.hero{background:var(--ink);color:#fff;border-radius:1.2em;box-shadow:.4em .4em 0 #e11d8d;padding:2.2vh 3vw;max-width:82vw}
.hero h1{margin:.1em 0;font-size:2.3em;line-height:1.05;font-weight:800}
.hero p{margin:.3em 0 0;color:#e3dcff;font-size:.95em}
.go{border:.18em solid var(--ink);background:#ff6b35;color:#fff;border-radius:1em;padding:.4em 1.5em;font-weight:800;font-size:1.25em;box-shadow:.25em .25em 0 var(--ink);transition:transform .12s}
.go:hover:not(:disabled){transform:translateY(-.1em)}
.go:disabled{opacity:.35;cursor:default}
.go.sec{background:#fff;color:var(--ink)}
.hub{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.1vw;flex:1;min-height:0}
.mc{border:.2em solid var(--ink);border-radius:1.1em;background:#fff;box-shadow:.3em .3em 0 var(--c);padding:.7em .9em;text-align:left;display:flex;flex-direction:column;gap:.15em;transition:transform .12s;position:relative}
.mc:hover{transform:translateY(-.15em)}
.mc .n{position:absolute;right:.7em;top:.5em;font-weight:800;font-size:.8em;color:var(--muted)}
.mc .e{font-size:2.6em;line-height:1}
.mc b{font-size:1.2em;line-height:1.15}
.mc span{font-size:.72em;color:var(--muted);font-weight:500;line-height:1.25}
.mc i{margin-top:auto;font-style:normal;font-weight:800;font-size:.8em;color:var(--c)}
.mc.done{background:color-mix(in srgb,var(--c) 10%,#fff)}

/* крок */
.step{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1fr);gap:1.5vw}
.step.solo{grid-template-columns:minmax(0,1fr)}
.card{background:#fff;border:.2em solid var(--ink);border-radius:1.2em;box-shadow:.3em .3em 0 var(--c,#ff6b35);padding:1.4vh 1.6vw;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.7em}
.card.fill{flex:1}
.art{display:flex;align-items:center;justify-content:center;padding:1vh;overflow:hidden;background:#fff}
.art svg,.art>img{max-width:100%;max-height:100%;display:block}
.badge{align-self:flex-start;background:var(--c,#ff6b35);color:#fff;border-radius:99px;padding:.05em .9em;font-weight:800;font-size:.6em;letter-spacing:.06em;text-transform:uppercase}
.q{font-size:1.7em;font-weight:700;line-height:1.25;margin:0}
.cnt{font-size:.62em;color:var(--muted);font-weight:700;margin-left:auto}
.row{display:flex;align-items:center;gap:.8em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.7em}
.opt{border:.16em solid var(--ink);border-radius:.9em;background:#fff;box-shadow:.18em .18em 0 var(--ink);padding:.5em .6em;font-weight:700;font-size:1.15em;display:flex;align-items:center;justify-content:center;gap:.5em;text-align:center;transition:transform .1s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-.08em);background:color-mix(in srgb,var(--c) 18%,#fff)}
.opt img{height:4.2em;width:auto;max-width:100%;object-fit:contain}
.opt.right{background:var(--ok);color:#fff;animation:pop .4s}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.45}
.fb{border-radius:.9em;padding:.5em .9em;font-weight:600;font-size:.9em;display:none}
.fb.show{display:block;animation:fade .25s}
.fb.ok{background:#d6f7e5;border:.12em solid var(--ok)}
.fb.no{background:#ffe0dd;border:.12em solid var(--bad)}
.nav{display:flex;align-items:center;gap:1em;flex:none}
.dots{display:flex;gap:.35em;flex:1}
.dots i{height:.55em;flex:1;max-width:3.2em;border-radius:99px;background:#d9d3ee;border:.1em solid var(--ink)}
.dots i.on{background:var(--c,#ff6b35)}
.dots i.cur{background:#ffc94a}
.nx{padding:.3em 1.3em;font-size:1.1em}

/* пари */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:.6em 2.4vw}
.mt>div{display:grid;gap:.55em;align-content:start}
.m{border:.16em solid var(--ink);border-radius:.8em;background:#fff;padding:.4em .8em;text-align:left;font-weight:600;font-size:1em;display:flex;align-items:center;gap:.6em;line-height:1.2;transition:transform .1s}
.m img{height:3.4em;width:auto;max-width:6em;object-fit:contain;flex:none}
.m:hover:not(:disabled){transform:scale(1.015)}
.m.sel{background:#ffc94a;transform:scale(1.02)}
.m.bad{background:#ffe0dd;animation:shake .4s}
.m.ok{color:#fff;background:var(--mc)}
.m:disabled{cursor:default}
.hint{font-size:.78em;color:var(--muted);margin:0;font-weight:500}

/* гарячі точки */
.hotbox{display:flex;align-items:center;justify-content:center;min-height:0;padding:.8vh;background:#fff}
.hotwrap{position:relative;flex:none;cursor:crosshair;border:.15em solid var(--ink);border-radius:.4em;overflow:hidden;line-height:0}
.hotwrap img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hz{position:absolute;border:.22em solid var(--ok);background:rgba(23,178,106,.18);border-radius:.3em;pointer-events:none;animation:pop .35s}
.hz b{position:absolute;left:0;top:-1.5em;background:var(--ok);color:#fff;font:700 .55em var(--font);padding:.1em .6em;border-radius:.4em;white-space:nowrap;line-height:1.3}
.hz.hint{border-color:#ffc94a;background:rgba(255,201,74,.25);animation:blink .8s infinite}
.rip{position:absolute;width:3em;height:3em;margin:-1.5em;border:.2em solid var(--bad);border-radius:50%;animation:rip .6s forwards;pointer-events:none}
.found{display:grid;gap:.4em;font-size:.78em}
.found div{background:#d6f7e5;border:.1em solid var(--ok);border-radius:.7em;padding:.25em .7em;animation:pop .3s}
.find{font-size:1.9em;font-weight:800;line-height:1.1;color:var(--c)}

/* впорядкування */
.ord{display:grid;gap:.5em}
.o{display:flex;gap:.7em;align-items:center;border:.16em solid var(--ink);border-radius:.8em;padding:.35em .7em;background:#fff;text-align:left;font-weight:600;font-size:.95em}
.o:hover:not(:disabled){background:color-mix(in srgb,var(--c) 15%,#fff)}
.o .nn{flex:none;min-width:1.9em;height:1.9em;border-radius:50%;border:.14em dashed var(--muted);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.o.set{background:#d6f7e5;border-color:var(--ok)}
.o.set .nn{border:.14em solid var(--ok);background:var(--ok);color:#fff}
.o.bad{background:#ffe0dd;animation:shake .4s}

/* лабораторії */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.4vw;min-height:0;flex:1}
.ctl{display:grid;gap:.55em;align-content:start}
.ctl label{display:flex;flex-direction:column;gap:.1em;font-weight:700;font-size:.85em}
.ctl label span{display:flex;justify-content:space-between}
.ctl input[type=range]{width:100%;accent-color:var(--c);height:1.6em}
.pills{display:flex;gap:.45em;flex-wrap:wrap}
.pl{border:.15em solid var(--ink);border-radius:99px;background:#fff;padding:.05em .8em;font-weight:700;font-size:.85em}
.pl.on{background:var(--c);color:#fff}
.pl:hover{background:#ffc94a;color:var(--ink)}
.pv{border:.18em dashed var(--muted);border-radius:1em;background:#fffdf8;padding:1em 1.2em;overflow:hidden;min-height:0;flex:1}
.task{background:#fff2c2;border:.14em solid var(--ink);border-radius:.8em;padding:.4em .8em;font-weight:600;font-size:.88em}
.rule{font-size:.82em;font-weight:600;display:flex;gap:.5em;align-items:center}
.rule i{font-style:normal;width:1.4em;height:1.4em;border-radius:50%;display:grid;place-items:center;background:#ffe0dd;color:var(--bad);font-weight:800;flex:none;font-size:.9em}
.rule.ok i{background:var(--ok);color:#fff}
.swatch{height:5.5em;border:.18em solid var(--ink);border-radius:.9em;transition:background .15s}
.tgt{display:flex;gap:.6em;align-items:center;font-weight:700}
.tgt i{width:2.4em;height:2.4em;border-radius:.5em;border:.15em solid var(--ink);display:inline-block}

/* сітка-макет */
.gbox{display:flex;align-items:center;justify-content:center;min-height:0;padding:.8vh;background:#fff}
.gb{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:.28em;background:#fff;padding:.4em;border:.18em solid var(--ink);border-radius:.4em;box-shadow:.2em .2em 0 var(--ink);flex:none}
.gc{border:.1em dashed #c5bfe0;border-radius:.2em;background:#faf9ff;cursor:pointer}
.gc:hover{background:#fff2c2}
.blk{border:.14em solid var(--ink);border-radius:.35em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.7em;padding:.2em;cursor:pointer;z-index:2;line-height:1.1;color:#fff;overflow:hidden}
.blk.sel{outline:.25em solid #ffc94a}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.pb{border:.16em solid var(--ink);border-radius:.7em;padding:.3em .4em;font-weight:800;font-size:.7em;color:#fff;text-align:center;line-height:1.15;transition:transform .1s}
.pb small{display:block;font-weight:600;opacity:.9}
.pb.sel{outline:.25em solid #ffc94a;transform:scale(1.04)}
.pb.used{opacity:.3}

/* підсумок */
.res{display:grid;grid-template-columns:1fr 1.1fr;gap:2vw;flex:1;min-height:0}
.rbox{background:var(--ink);color:#fff;border-radius:1.2em;box-shadow:.4em .4em 0 #17b26a;padding:2vh 2vw;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:.3em}
.rbox .big{font-size:4.2em;font-weight:800;color:#ffc94a;line-height:1}
.rbox .rk{font-size:1.5em;font-weight:800}
.rbox .st{color:#e3dcff;font-size:.85em}
.list{background:#fff;border:.2em solid var(--ink);border-radius:1.2em;padding:1.4vh 1.5vw;overflow:auto;box-shadow:.3em .3em 0 var(--ink);display:grid;gap:.4em;align-content:start}
.list h3{margin:0 0 .2em;font-size:1.15em}
.list div{display:flex;gap:.6em;align-items:center;border-bottom:.1em dashed #c9c4e6;padding:.25em 0;font-size:.85em;font-weight:600}
.list div b{margin-left:auto;color:var(--ok)}
.btns{display:flex;gap:1vw;justify-content:center;flex:none}
.sum{align-items:center;justify-content:center;text-align:center;gap:1.2vh}
.sum .big{font-size:4em}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.4em)}40%{transform:translateX(.4em)}60%{transform:translateX(-.25em)}80%{transform:translateX(.25em)}}
@keyframes blink{50%{opacity:.35}}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:900px){
  body{overflow:auto;font-size:16px}#app{height:auto;min-height:100dvh}
  .step,.lab,.res,.mt{grid-template-columns:1fr}.hub{grid-template-columns:1fr 1fr;grid-template-rows:none}
  .art{min-height:40vh}.hero{max-width:100%}.ttl small{display:none}
}
</style>
</head>

function artGrid(hl){
  const W=300,H=400,m=30,g=10,cols=4,rows=6,cw=(W-2*m-(cols-1)*g)/cols,rh=(H-2*m-(rows-1)*g)/rows,ox=30,oy=20;
  let s='<rect x="'+ox+'" y="'+oy+'" width="'+W+'" height="'+H+'" fill="#fff" '+ST+'/>';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+='<rect x="'+(ox+m+c*(cw+g))+'" y="'+(oy+m+r*(rh+g))+'" width="'+cw+'" height="'+rh+'" fill="#e6e0ff" stroke="#a79bd8" stroke-width="1.5"/>';
  const hlc=OR,op=' fill="'+hlc+'" opacity=".75"';
  if(hl==="margin")s+='<rect x="'+ox+'" y="'+oy+'" width="'+W+'" height="'+m+'"'+op+'/><rect x="'+ox+'" y="'+(oy+H-m)+'" width="'+W+'" height="'+m+'"'+op+'/><rect x="'+ox+'" y="'+oy+'" width="'+m+'" height="'+H+'"'+op+'/><rect x="'+(ox+W-m)+'" y="'+oy+'" width="'+m+'" height="'+H+'"'+op+'/>';
  if(hl==="column")s+='<rect x="'+(ox+m+cw+g)+'" y="'+(oy+m)+'" width="'+cw+'" height="'+(H-2*m)+'"'+op+'/>';
  if(hl==="gutter")s+='<rect x="'+(ox+m+cw)+'" y="'+(oy+m)+'" width="'+g+'" height="'+(H-2*m)+'"'+op+'/>';
  if(hl==="module")s+='<rect x="'+(ox+m+2*(cw+g))+'" y="'+(oy+m+2*(rh+g))+'" width="'+cw+'" height="'+rh+'"'+op+' stroke="'+INK+'" stroke-width="3"/>';
  return SVG("0 0 360 440",s);
}
function artBleed(b,cut){ /* 1 мм = 9 px; макет 30 x 20 мм; різак зсувається на 2 мм */
  const k=9,w=30*k,h=20*k,ox=60,oy=50;
  if(cut){
    const gap=Math.max(0,2-b);
    let s='<rect width="420" height="300" fill="#8c86ad"/><rect x="'+ox+'" y="'+oy+'" width="'+w+'" height="'+h+'" fill="#fff"/>'
     +'<rect x="'+(ox+gap*k)+'" y="'+oy+'" width="'+(w-gap*k)+'" height="'+h+'" fill="'+PK+'"/>'
     +'<rect x="'+(ox+30)+'" y="'+(oy+30)+'" width="'+(w-60)+'" height="'+(h-60)+'" rx="8" fill="#fff"/>'+tx(ox+w/2,oy+h/2+8,"Листівка",24)
     +'<rect x="'+ox+'" y="'+oy+'" width="'+w+'" height="'+h+'" fill="none" '+ST+'/>'
     +tx(210,285,gap>0?"Біла смужка "+gap+" мм зліва: брак!":"Ідеально: країв без білого немає",18,'fill="'+(gap>0?"#ffd4d0":"#d6f7e5")+'"');
    return SVG("0 0 420 300",s);
  }

const resetS=()=>{S={score:0,streak:0,mi:-1,si:0,m:MISSIONS.map(()=>({units:0,ok:0,done:false,seen:false}))};paintTop()};
const mult=()=>S.streak>=6?3:S.streak>=3?2:1;
function paintTop(){$("#score").textContent=S.score;$("#mult").textContent=mult();$("#streak").classList.toggle("on",mult()>1)}
function unit(first){const m=S.m[S.mi];m.units++;if(first){m.ok++;S.streak++;S.score+=100*mult()}else S.streak=0;paintTop();return first?100*mult():0}
function setScreen(cls){if(cleanup){cleanup();cleanup=null}stage.innerHTML="";const s=el("div","screen "+(cls||""));stage.appendChild(s);return s}
function setWhere(t){$("#where").textContent=t}

/* --- карта місій --- */
function hub(){
  S.mi=-1;setWhere("Оберіть місію");
  const s=setScreen();
  const done=S.m.filter(m=>m.done).length;
  s.innerHTML='<div class="hub" id="hub"></div><div class="btns"><button class="go sec" id="rs"'+(S.m.some(m=>m.seen)?"":" disabled")+'>🏁 Підсумок гри</button></div>';
  const h=$("#hub",s);
  MISSIONS.forEach((m,i)=>{
    const st=S.m[i];
    const b=el("button","mc"+(st.done?" done":""),'<span class="n">'+(i+1)+'</span><div class="e">'+m.emoji+'</div><b>'+m.title+'</b><span>'+m.sub+'</span><i>'+(st.done?"✓ ⭐ "+st.ok+" / "+st.units:st.seen?"розпочато":"Почати ▶")+'</i>');
    b.style.setProperty("--c",m.c);b.onclick=()=>startMission(i);h.appendChild(b);
  });
  $("#rs",s).onclick=final;
}
function intro(){
  resetS();setWhere("Інформатика · Розділ 8 · комп'ютерна верстка");
  const s=setScreen("center");
  s.innerHTML='<div class="hero"><h1>🗞️ Верстальна майстерня</h1><p>Ви — верстальники редакції «Ліцейний вісник». Пройдіть 8 місій, зберіть номер і підготуйте його до друку. Місії можна обирати в будь-якому порядку.</p></div>'
   +'<div class="btns"><button class="go" id="st">▶ До місій</button></div><div class="hint">Відповідь із першої спроби дає ⭐, а серія правильних відповідей збільшує множник · Пробіл чи Enter — далі</div>';
  $("#st",s).onclick=hub;
}

/* --- місія --- */
function startMission(i){S.mi=i;S.si=0;S.m[i].seen=true;S.m[i]={...S.m[i],units:0,ok:0,done:false,seen:true};step()}
function step(){
  const M=MISSIONS[S.mi],st=M.steps[S.si];
  setWhere("Місія "+(S.mi+1)+" · "+M.title);
  const s=setScreen();s.style.setProperty("--c",M.c);
  const body=el("div");body.style.display="contents";s.appendChild(body);
  const nav=el("div","nav");
  const dots=el("div","dots");M.steps.forEach((_,k)=>dots.appendChild(el("i",k<S.si?"on":k===S.si?"cur":"")));
  const nx=el("button","go nx","Далі ▶");nx.disabled=true;
  nav.appendChild(dots);nav.appendChild(nx);s.appendChild(nav);
  curNext=null;
  const api={
    box:body,M,st,
    setNext(fn,label){curNext=fn;nx.disabled=!fn;if(label)nx.textContent=label;else nx.textContent=S.si+1<M.steps.length?"Далі ▶":"Завершити місію ▶"},
    finish(){api.setNext(()=>{S.si++;S.si<M.steps.length?step():missionDone()})},
    unit
  };
  nx.onclick=()=>{if(curNext)curNext()};
  RENDER[st.k](body,st,api);
}
function missionDone(){
  const m=S.m[S.mi],M=MISSIONS[S.mi];m.done=true;setWhere("Місію виконано");
  const s=setScreen("sum");
  s.innerHTML='<div class="big">'+M.emoji+'</div><div class="hero" style="box-shadow:.4em .4em 0 '+M.c+'"><h1>Місію виконано!</h1><p>'+M.title+': ⭐ '+m.ok+' з '+m.units+' із першої спроби</p></div><div class="btns"><button class="go sec" id="h">🏠 До місій</button>'+(S.mi+1<MISSIONS.length?'<button class="go" id="n">Наступна місія ▶</button>':'<button class="go" id="n">🏁 Підсумок</button>')+'</div>';
  $("#h",s).onclick=hub;$("#n",s).onclick=()=>S.mi+1<MISSIONS.length?startMission(S.mi+1):final();
  curNext=()=>$("#n",s).click();
}
function final(){
  S.mi=-1;setWhere("Підсумок");
  const ok=S.m.reduce((a,m)=>a+m.ok,0),un=S.m.reduce((a,m)=>a+m.units,0),pct=un?Math.round(ok/un*100):0;
  const rank=pct>=90?["🏆","Головний редактор"]:pct>=75?["🥇","Верстальник-профі"]:pct>=55?["🥈","Практикант"]:["🥉","Стажер: повторіть матеріал і спробуйте ще"];
  const s=setScreen();
  s.innerHTML='<div class="res"><div class="rbox"><div class="rk">'+rank[0]+' '+rank[1]+'</div><div class="big">'+S.score+'</div><div class="st">очок · з першої спроби '+ok+' із '+un+' ('+pct+' %)</div></div>'
   +'<div class="list"><h3>Місії</h3>'+MISSIONS.map((m,i)=>'<div>'+m.emoji+' '+m.title+'<b>'+(S.m[i].seen?"⭐ "+S.m[i].ok+" / "+S.m[i].units:"—")+'</b></div>').join("")+'</div></div>'
   +'<div class="btns"><button class="go sec" id="h">🏠 До місій</button><button class="go" id="again">🔄 Грати спочатку</button></div>';
  $("#h",s).onclick=hub;$("#again",s).onclick=intro;
}

  const items=st.items;let i=0;
  const w=el("div","step"+(st.art||items.some(x=>x.art)?"":" solo"));box.appendChild(w);
  function show(){
    const it=items[i];w.innerHTML="";

  const g=el("div","mt");c.appendChild(g);const L=el("div"),R=el("div");g.appendChild(L);g.appendChild(R);

      if(li===i){const col=cols[i%cols.length];[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.style.setProperty("--mc",col);x.disabled=true});sel=null;unit(!wrongs[li]);left--;if(!left)api.finish()}
      else{wrongs[li]=true;const s0=sel;[s0,b].forEach(x=>x.classList.add("bad"));setTimeout(()=>[s0,b].forEach(x=>x.classList.remove("bad")),450);s0.classList.remove("sel");sel=null}
    };R.appendChild(b);
  });

order(box,st,api){
  const w=el("div","step solo");const c=el("div","card");w.appendChild(c);box.appendChild(w);
  c.appendChild(el("div","row",'<span class="badge">'+st.t+'</span>'));
  c.appendChild(el("p","hint","Натискайте кроки по порядку: спочатку перший, потім другий і так далі."));
  const og=el("div","ord");c.appendChild(og);const fb=el("div","fb");c.appendChild(fb);
  let next=0,wrong=false;
  shuffle(st.steps.map((s,i)=>i)).forEach(i=>{
    const b=el("button","o",'<span class="nn">?</span><span>'+st.steps[i]+'</span>');
    b.onclick=()=>{if(b.disabled)return;
      if(i===next){next++;b.classList.add("set");b.disabled=true;$(".nn",b).textContent=next;
        if(next===st.steps.length){const g=unit(!wrong);fb.className="fb show ok";fb.innerHTML="✅ "+(g?"+"+g+" · ":"")+(st.e||"");api.finish()}}
      else{wrong=true;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450)}};
    og.appendChild(b);

},
hot(box,st,api){
  const w=el("div","step");box.appendChild(w);
  const hb=el("div","card hotbox");const wrap=el("div","hotwrap");const img=el("img");img.src=IMG[st.img];wrap.appendChild(img);hb.appendChild(wrap);
  const c=el("div","card");
  c.appendChild(el("div","row",'<span class="badge">'+st.t+'</span><span class="cnt" id="hc"></span>'));
  c.appendChild(el("p","hint","Знайдіть і натисніть на зображенні:"));
  const find=el("div","find");c.appendChild(find);
  const fd=el("div","found");c.appendChild(fd);
  w.appendChild(hb);w.appendChild(c);
  function fit(){const r=hb.getBoundingClientRect();const pad=14;let h=r.height-pad*2,ww=h*st.ratio[0]/st.ratio[1];if(ww>r.width-pad*2){ww=r.width-pad*2;h=ww*st.ratio[1]/st.ratio[0]}wrap.style.width=ww+"px";wrap.style.height=h+"px"}
  requestAnimationFrame(fit);window.addEventListener("resize",fit);const prev=cleanup;cleanup=()=>{window.removeEventListener("resize",fit);if(prev)prev()};
  let ti=0,miss=0;
  const mark=()=>{$("#hc",c).textContent=Math.min(ti+1,st.targets.length)+" / "+st.targets.length};
  function ask(){if(ti>=st.targets.length){find.textContent="Усе знайдено! 🎉";api.finish();return}find.textContent=st.targets[ti].n;mark();miss=0}
  ask();
  wrap.onclick=e=>{
    if(ti>=st.targets.length)return;
    const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,t=st.targets[ti];
    if(t.r.some(q=>x>=q[0]&&x<=q[0]+q[2]&&y>=q[1]&&y<=q[1]+q[3])){
      wrap.querySelectorAll(".hz.hint").forEach(h=>h.remove());
      t.r.forEach(q=>{const z=el("div","hz");z.style.cssText="left:"+q[0]+"%;top:"+q[1]+"%;width:"+q[2]+"%;height:"+q[3]+"%";wrap.appendChild(z)});
      fd.appendChild(el("div","","✅ <b>"+t.n+"</b>: "+t.e));
      unit(miss===0);ti++;ask();
    }else{
      miss++;const rp=el("div","rip");rp.style.left=(e.clientX-r.left)+"px";rp.style.top=(e.clientY-r.top)+"px";wrap.appendChild(rp);setTimeout(()=>rp.remove(),650);
      if(miss===3){const q=t.r[0];const z=el("div","hz hint");z.style.cssText="left:"+q[0]+"%;top:"+q[1]+"%;width:"+q[2]+"%;height:"+q[3]+"%";wrap.appendChild(z)}
    }
  };
  api.setNext(null);
},
custom(box,st,api){CUSTOM[st.id](box,st,api)}

/* --- вильоти --- */
bleed(box,st,api){
  let b=0,cut=false,wrong=false;
  const w=el("div","step");box.appendChild(w);
  const art=el("div","card art");const c=el("div","card");w.appendChild(art);w.appendChild(c);
  c.innerHTML='<div class="row"><span class="badge">Вильоти</span></div><p class="q" style="font-size:1.2em">Різак у друкарні може зсунутися приблизно на 2 мм. Підберіть вильоти (заливку за лінією обрізу) так, щоб на краю не було білої смужки.</p>'
   +'<div class="ctl"><label><span>Вильоти <b id="bv">0 мм</b></span><input type="range" id="br" min="0" max="5" step="0.5" value="0"></label><div class="row"><button class="go nx" id="cb" style="font-size:.95em">✂️ Розрізати</button></div></div><div class="fb" id="fb"></div>';
  const fb=$("#fb",c);
  function paint(){art.innerHTML=artBleed(b,cut);$("#bv",c).textContent=b+" мм"}
  $("#br",c).oninput=e=>{b=+e.target.value;cut=false;fb.className="fb";paint()};
  $("#cb",c).onclick=()=>{cut=true;paint();
    if(b<2){wrong=true;fb.className="fb show no";fb.innerHTML="З'явилась біла смужка. Збільшіть вильоти й розріжте ще раз."}
    else if(b<3){wrong=true;fb.className="fb show no";fb.innerHTML="Цього разу без смужки, але стандарт для вильотів — 3 мм: так надійніше."}
    else{const g=unit(!wrong);fb.className="fb show ok";fb.innerHTML="✅ Вильоти "+b+" мм: край чистий. "+(g?"+"+g:"");$("#cb",c).disabled=true;api.finish()}};
  paint();api.setNext(null);
},
/* --- модульна сітка --- */
grid(box,st,api){
  const BLK={
   head:{n:"Заголовок",w:4,h:1,c:OR},foot:{n:"Колонтитул",w:4,h:1,c:"#6b6590"},
   photo:{n:"Фото",w:2,h:2,c:BL},text:{n:"Текст",w:2,h:2,c:GR},
   cap:{n:"Підпис",w:2,h:1,c:VI},sid:{n:"Врізка",w:2,h:1,c:PK}};
  const RULES=[["head","Заголовок — у верхньому ряду",p=>p.head&&p.head.r===0],["foot","Колонтитул — унизу",p=>p.foot&&p.foot.r===4],
   ["ph","Фото й текст стоять поруч у середині",p=>p.photo&&p.text&&p.photo.r===1&&p.text.r===1&&p.photo.c!==p.text.c],
   ["cap","Підпис — одразу під фото",p=>p.photo&&p.cap&&p.cap.r===p.photo.r+2&&p.cap.c===p.photo.c],
   ["sid","Врізка — під текстом",p=>p.text&&p.sid&&p.sid.r===p.text.r+2&&p.sid.c===p.text.c]];
  const placed={};let sel=null,bad=0,finished=false;
  const w=el("div","step");box.appendChild(w);
  const gb=el("div","card gbox");const grid=el("div","gb");gb.appendChild(grid);
  const c=el("div","card");w.appendChild(gb);w.appendChild(c);
  c.innerHTML='<div class="row"><span class="badge">Зверстай сторінку</span></div><p class="hint">Оберіть блок і натисніть клітинку сітки: це його верхній лівий кут. Натисніть на розміщений блок, щоб зняти його.</p><div class="pal" id="pal"></div><div id="rl" style="display:grid;gap:.3em"></div><div class="fb" id="fb"></div>';
  function fit(){const r=gb.getBoundingClientRect(),pad=14;let h=r.height-pad*2,ww=h*4/5;if(ww>r.width-pad*2){ww=r.width-pad*2;h=ww*5/4}grid.style.width=ww+"px";grid.style.height=h+"px"}
  requestAnimationFrame(fit);window.addEventListener("resize",fit);cleanup=()=>window.removeEventListener("resize",fit);
  const pal=$("#pal",c);
  function draw(){
    grid.innerHTML="";
    for(let r=0;r<5;r++)for(let q=0;q<4;q++){const cell=el("div","gc");cell.style.cssText="grid-row:"+(r+1)+";grid-column:"+(q+1);cell.onclick=()=>put(r,q);grid.appendChild(cell)}
    Object.keys(placed).forEach(k=>{const p=placed[k],B=BLK[k];const b=el("div","blk"+(sel===k?" sel":""),B.n);b.style.cssText="grid-row:"+(p.r+1)+"/span "+B.h+";grid-column:"+(p.c+1)+"/span "+B.w+";background:"+B.c;b.onclick=()=>{delete placed[k];sel=k;draw()};grid.appendChild(b)});
    pal.innerHTML="";
    Object.keys(BLK).forEach(k=>{const B=BLK[k];const b=el("button","pb"+(sel===k?" sel":"")+(placed[k]?" used":""),B.n+"<small>"+B.w+" × "+B.h+"</small>");b.style.background=B.c;b.disabled=!!placed[k];b.onclick=()=>{sel=k;draw()};pal.appendChild(b)});
    const rl=$("#rl",c);rl.innerHTML=RULES.map(R=>'<div class="rule'+(R[2](placed)?" ok":"")+'"><i>'+(R[2](placed)?"✓":"·")+'</i>'+R[1]+'</div>').join("");
    if(!finished&&RULES.every(R=>R[2](placed))&&Object.keys(placed).length===6){finished=true;const g=unit(bad===0);const fb=$("#fb",c);fb.className="fb show ok";fb.innerHTML="✅ Сторінка зверстана за сіткою! "+(g?"+"+g+" ":"");api.finish()}
  }
  function put(r,q){
    if(!sel||placed[sel])return;const B=BLK[sel];
    const ok=r+B.h<=5&&q+B.w<=4&&!Object.keys(placed).some(k=>{const p=placed[k],O=BLK[k];return !(q+B.w<=p.c||p.c+O.w<=q||r+B.h<=p.r||p.r+O.h<=r)});
    if(!ok){bad++;grid.animate([{transform:"translateX(0)"},{transform:"translateX(-.3em)"},{transform:"translateX(.3em)"},{transform:"translateX(0)"}],{duration:300});return}
    placed[sel]={r,c:q};sel=null;draw();
  }
  draw();api.setNext(null);
}
};

$("#home").onclick=()=>{if(S)hub()};
$("#fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}};
intro();
