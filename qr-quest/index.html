<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR-квест · Цифрова грамотність · КПЛТ</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#6d4aff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quest.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="logo.png" alt="КПЛТ">
    <div>
      <h1>QR-квест «Цифрова грамотність»</h1>
      <small>КПЛТ · 23–27 листопада 2026</small>
      <small id="who" class="who hidden"></small>
    </div>
  </div>
  <div id="demo" class="demo hidden">🧪 Демо-режим: сервер ще не підключено, дані зберігаються лише в цьому браузері.</div>
  <main id="app"><div class="spinner"></div></main>
  <p class="foot"><a href="rating.html">🏆 Рейтинг</a> · <a href="#" id="notme" class="hidden">Це не я</a></p>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const P = qs.get('p'), K = qs.get('k');
const LS = 'qrq_id';
// ID учасника: localStorage + cookie (у Safari одне з них іноді очищається)
const cookieGet = () => { const m = document.cookie.match(/(?:^|; )qrq_id=([^;]+)/); return m ? decodeURIComponent(m[1]) : null; };
const store = {
  get() { let v = null; try { v = localStorage.getItem(LS); } catch (e) {} return v || cookieGet() || window._id || null; },
  set(v) { window._id = v; try { localStorage.setItem(LS, v); } catch (e) {}
           document.cookie = 'qrq_id=' + encodeURIComponent(v) + '; max-age=' + 60 * 60 * 24 * 60 + '; path=/; SameSite=Lax'; },
  del() { window._id = null; try { localStorage.removeItem(LS); } catch (e) {} document.cookie = 'qrq_id=; max-age=0; path=/'; }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LETTERS = 'АБВГДЕ';

if (QuestAPI.demo) document.getElementById('demo').classList.remove('hidden');
document.getElementById('notme').onclick = e => {
  e.preventDefault();
  if (confirm('Вийти з цього профілю? Потім введіть ті самі прізвище та ім’я — прогрес збережеться.')) { store.del(); location.reload(); }
};

function view(html) { $app.innerHTML = html; window.scrollTo(0, 0); }
function errorView(msg) {
  view(`<div class="card result bad"><div class="big">⚠️</div><h2>Упс</h2><p>${esc(msg)}</p>
        <button class="btn ghost" onclick="location.reload()">Спробувати ще раз</button></div>`);
}

function gridHTML(pr, cur) {
  let h = '';
  for (let i = 1; i <= pr.total; i++) {
    const v = pr.done[i];
    h += `<div class="${v === true ? 'g' : v === false ? 'r' : ''} ${String(i) === String(cur) ? 'cur' : ''}">${i}</div>`;
  }
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b>Ваш прогрес</b><span class="muted">знайдено ${pr.answered} з ${pr.total}</span></div>
    <div class="bar"><i style="width:${Math.round(pr.answered / pr.total * 100)}%"></i></div>
    <div class="muted score-line"><span>Правильних: <b style="color:var(--ink)">${pr.correct}</b></span><span>Бали: <b style="color:var(--brand)">${pr.points || 0}</b></span></div>
    <div class="grid">${h}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>правильно</span>
      <span><i style="background:var(--bad)"></i>помилка</span>
      <span><i style="background:var(--idle)"></i>ще не знайдено</span></div>
  </div>`;
}

// ── Реєстрація ───────────────────────────────────────────────
function registerView(then) {
  view(`<div class="card">
    <span class="chip">Крок 1 · Хто ви?</span>
    <h2>Привіт! Хто проходить квест?</h2>
    <p class="muted">Уже грали з іншого телефона чи браузер вас «забув»? Просто введіть ті самі дані — прогрес продовжиться.</p>
    <label class="f">Я —</label>
    <div class="roles" id="roles">
      <button type="button" data-r="student"><span>🎓</span>Студент</button>
      <button type="button" data-r="staff"><span>🏫</span>Працівник ліцею</button>
    </div>
    <label class="f" for="last">Прізвище</label>
    <input type="text" id="last" autocomplete="family-name" maxlength="40" placeholder="Шевченко">
    <label class="f" for="first">Ім’я</label>
    <input type="text" id="first" autocomplete="given-name" maxlength="40" placeholder="Олена">
    <div id="groupBox" class="hidden">
      <label class="f" for="group">Група</label>
      <input type="text" id="group" maxlength="15" placeholder="напр. 202">
    </div>
    <label class="check"><input type="checkbox" id="agree">
      <span>Погоджуюся, що моє прізвище, ім’я та група будуть використані для підрахунку результатів квесту і показані в рейтингу.</span></label>
    <button class="btn" id="go" disabled>Почати квест →</button>
    <div id="similar"></div>
    <div class="err" id="err"></div>
  </div>`);
  const $ = id => document.getElementById(id);
  let role = null;
  const check = () => {
    $('go').disabled = !(role && $('last').value.trim().length > 1 && $('first').value.trim().length > 1 &&
      (role !== 'student' || $('group').value.trim()) && $('agree').checked);
  };
  document.querySelectorAll('#roles button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#roles button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); role = b.dataset.r;
    $('groupBox').classList.toggle('hidden', role !== 'student');
    check();
  });
  ['last', 'first', 'group', 'agree'].forEach(id => { $(id).addEventListener('input', check); $(id).addEventListener('change', check); });
  async function send(force) {
    $('go').disabled = true; $('go').textContent = 'Зберігаю…'; $('err').textContent = ''; $('similar').innerHTML = '';
    const r = await QuestAPI.call({ action: 'register', cat: role, last: $('last').value.trim(), first: $('first').value.trim(),
                                    group: role === 'student' ? $('group').value.trim() : '', force: !!force });
    $('go').textContent = 'Почати квест →';
    if (r.similar) {
      $('similar').innerHTML = `<div class="explain" style="margin-top:16px"><b>🤔 Можливо, це ви?</b>
        <p class="muted" style="margin:4px 0 10px">Учасник з дуже схожим ім’ям уже грає.</p>
        ${r.similar.map(x => `<button class="btn ghost" data-id="${esc(x.id)}" style="margin-top:8px">✅ Так, це я: ${esc(x.name)}${x.group ? ' · ' + esc(x.group) : ''}</button>`).join('')}
        <button class="btn ghost" id="isNew" style="margin-top:8px;background:#fff;border:2px solid var(--line)">Ні, я новий учасник</button></div>`;
      $('similar').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { store.set(b.dataset.id); then(); });
      $('isNew').onclick = () => send(true);
      check(); return;
    }
    if (!r.ok) { $('err').textContent = r.error; check(); return; }
    store.set(r.id);
    then();
  }
  $('go').onclick = () => send(false);
}

// ── Запитання ────────────────────────────────────────────────
let TICK = null;
const mmss = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
async function questionFlow() {
  clearInterval(TICK);
  view('<div class="spinner"></div>');
  const pr = await QuestAPI.call({ action: 'progress', id: store.get() });
  if (pr.reRegister) { store.del(); return registerView(questionFlow); }
  if (!pr.ok) return errorView(pr.error);
  setWho(pr);
  const was = pr.progress.done[P];
  if (was !== undefined) {
    const q0 = await QuestAPI.call({ action: 'question', p: P, k: K });
    if (!q0.ok) return errorView(q0.error);
    return alreadyView(q0.point, was, pr.progress);
  }
  // запит із id запускає таймер точки на сервері (лише при першому відкритті)
  const q = await QuestAPI.call({ action: 'question', p: P, k: K, id: store.get() });
  if (!q.ok) return errorView(q.error);
  const pt = q.point, limit = q.limit || 120;
  let left = q.remaining == null ? limit : q.remaining;
  const endAt = Date.now() + left * 1000;

  view(`<div class="card">
      <span class="chip">Точка ${pt.n} з ${q.total} · ${esc(pt.topic)}</span>
      <div class="timer" id="timer"><b id="tl">${mmss(left)}</b><div class="tbar"><i id="tb" style="width:${left / limit * 100}%"></i></div></div>
      <p class="muted" style="margin:0 0 10px">⏱ Швидше відповіси — більше балів: до ${q.maxPoints || 100} за правильну відповідь.</p>
      <h2>${esc(pt.q)}</h2>
      <div class="opts" id="opts">${pt.options.map((o, i) =>
        `<button class="opt" data-i="${i}"><b>${LETTERS[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
      <p class="muted" style="margin-top:12px">Увага: відповісти можна лише один раз.</p>
      <button class="btn" id="send" disabled>Відповісти</button>
      <div class="err" id="err"></div>
    </div>` + gridHTML(pr.progress, pt.n));

  let choice = null, sent = false;
  const opts = [...document.querySelectorAll('.opt')];
  opts.forEach(b => b.onclick = () => {
    opts.forEach(x => x.classList.remove('on')); b.classList.add('on');
    choice = Number(b.dataset.i); document.getElementById('send').disabled = false;
  });
  async function submit(ch) {
    if (sent) return; sent = true; clearInterval(TICK);
    const send = document.getElementById('send');
    send.disabled = true; send.textContent = ch === -1 ? 'Час вийшов…' : 'Перевіряю…';
    opts.forEach(x => x.disabled = true);
    const r = await QuestAPI.call({ action: 'answer', id: store.get(), p: P, k: K, choice: ch });
    if (!r.ok) {
      if (r.reRegister) { store.del(); return registerView(questionFlow); }
      sent = false; document.getElementById('err').textContent = r.error;
      send.disabled = choice == null; send.textContent = 'Відповісти'; opts.forEach(x => x.disabled = false);
      return;
    }
    resultView(pt, r, ch);
  }
  document.getElementById('send').onclick = () => submit(choice);
  function tick() {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    const tl = document.getElementById('tl'); if (!tl) return clearInterval(TICK);
    tl.textContent = mmss(left);
    document.getElementById('tb').style.width = (left / limit * 100) + '%';
    const t = document.getElementById('timer');
    t.classList.toggle('warn', left <= 45 && left > 15); t.classList.toggle('crit', left <= 15);
    if (left <= 0) submit(-1);
  }
  tick(); TICK = setInterval(tick, 1000);
}

function resultView(pt, r, choice) {
  const pr = r.progress;
  const finished = pr.answered >= pr.total;
  const title = r.already ? 'Ви вже відповідали тут' : r.late ? 'Час вийшов ⏱' : r.correct ? 'Правильно!' : 'Неправильно';
  view(`<div class="card result ${r.correct ? 'ok' : 'bad'}">
      <div class="big">${r.late ? '⌛' : r.correct ? '🎉' : '🤔'}</div>
      <h2>${title}</h2>
      ${r.already ? '' : `<div class="pts">+${r.points || 0} балів</div>
      <p class="muted">${r.correct ? 'Відповідь за ' + r.sec + ' с' : r.late ? 'На запитання дається 2 хвилини' : 'За помилку бали не нараховуються'}</p>`}
      <p class="muted">Точка ${pt.n} · ${esc(pt.topic)}${choice != null && choice >= 0 && !r.already ? ' · ваша відповідь: ' + LETTERS[choice] : ''}</p>
      <div class="explain">💡 ${esc(r.explain)}</div>
    </div>
    ${finished ? `<div class="card result ok"><div class="big">🏆</div><h2>Квест пройдено!</h2>
      <p>Ви знайшли всі ${pr.total} точок: <b>${pr.correct}</b> правильних відповідей і <b>${pr.points}</b> балів.</p>
      <a class="btn" href="rating.html">Подивитися рейтинг</a></div>`
    : `<div class="card"><b>Шукайте наступний QR-код!</b>
      <p class="muted" style="margin:4px 0 0">Коди розклеєні по всьому ліцею — порядок не важливий.</p></div>`}
    ${gridHTML(pr, pt.n)}`);
}

function alreadyView(pt, correct, pr) {
  resultView(pt, { correct, already: true, explain: 'Цю точку вже зараховано. Шукайте інші QR-коди!', progress: pr }, null);
}

function setWho(pr) {
  const who = document.getElementById('who');
  who.textContent = '👤 ' + pr.name + ' · ' + (pr.group || (pr.cat === 'Працівники' ? 'працівник ліцею' : ''));
  who.classList.remove('hidden');
  document.getElementById('notme').classList.remove('hidden');
}

// ── Головна (без QR у посиланні) ─────────────────────────────
async function homeFlow() {
  let progressHTML = '';
  if (store.get()) {
    const pr = await QuestAPI.call({ action: 'progress', id: store.get() });
    if (pr.ok) { setWho(pr); progressHTML = gridHTML(pr.progress); }
    else if (pr.reRegister) store.del();
  }
  view(`<div class="card">
    <span class="chip">Тиждень цифрової грамотності · 23–27 листопада</span>
    <h2>Знайди всі QR-коди в ліцеї</h2>
    <p class="muted">Київський професійний ліцей транспорту</p>
    <ol class="rules">
      <li>По території ліцею розклеєно <b>15 QR-кодів</b>. Квест триває <b>з 23 по 27 листопада 2026</b> року включно.</li>
      <li>Відскануйте код камерою телефону — відкриється запитання.</li>
      <li>При першому скануванні оберіть, хто ви (студент чи працівник ліцею), і вкажіть прізвище та ім’я. Якщо телефон вас «забуде» — просто введіть ті самі дані, і прогрес продовжиться.</li>
      <li>На кожне запитання — <b>одна спроба і 2 хвилини</b>. Таймер стартує, щойно ви відкрили запитання, і не скидається при повторному скануванні.</li>
      <li>Правильна відповідь дає <b>від 50 до 100 балів</b>: що швидше, то більше. Помилка чи «час вийшов» — 0. Порядок точок не важливий.</li>
      <li>Вище в рейтингу той, хто набрав більше балів. Окремі <b>ТОП-10</b> для <b>студентів</b> і для <b>працівників ліцею</b>.</li>
    </ol>
  </div>${progressHTML}
  <a class="btn ghost" href="rating.html">🏆 Рейтинг учасників</a>`);
}

if (P && K) { store.get() ? questionFlow() : registerView(questionFlow); }
else homeFlow();
</script>
</body>
</html>
