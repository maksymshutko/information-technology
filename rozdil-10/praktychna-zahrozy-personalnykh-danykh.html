<html lang="uk">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практична робота: Аналіз загроз конфіденційності персональних даних</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0813; --card:#15102b; --card2:#1e1740;
  --teal:#5af0c7; --violet:#7900ff; --violet2:#a96bff; --yellow:#ffd60a; --white:#fff; --red:#ff4d6d; --green:#35e08a;
  --line:#5af0c7;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,1.6vw,34px)}
body{margin:0;height:100vh;overflow:hidden;font-family:"Rubik","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--white);background:var(--bg);user-select:none;
  background-image:radial-gradient(ellipse at 0% 0%,rgba(121,0,255,.45),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(90,240,199,.28),transparent 50%)}
#app{height:100vh;display:flex;flex-direction:column;padding:1vh 2vw}
header{display:flex;align-items:center;gap:1.4rem;height:12vh}
header img{height:11vh;width:auto;display:block}
.dots{flex:1;display:flex;gap:.6rem;justify-content:center}
.dot{width:1rem;height:1rem;border-radius:50%;border:.16rem solid var(--teal);cursor:pointer;transition:.2s;background:transparent}
.dot.done{background:var(--violet);border-color:var(--violet)}
.dot.on{background:var(--yellow);border-color:var(--yellow);transform:scale(1.5)}
.score{background:var(--yellow);color:#000;border-radius:2rem;padding:.2rem 1.1rem;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 .25rem 0 var(--violet)}
main{flex:1;position:relative;min-height:0}
.scene{display:none;height:100%;flex-direction:column;animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.scene.active{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(2vh) scale(.97)}to{opacity:1;transform:none}}
footer{display:flex;justify-content:space-between;align-items:center;height:8vh}
.btn{font:inherit;font-weight:900;font-size:1.25rem;color:#000;background:var(--teal);border:0;border-radius:1rem;padding:.5em 1.2em;box-shadow:0 .3rem 0 var(--violet);cursor:pointer;transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(.25rem);box-shadow:0 .05rem 0 var(--violet)}
.btn.y{background:var(--yellow);color:#000} .btn.v{background:var(--violet);color:#fff;box-shadow:0 .3rem 0 var(--teal)} .btn.r{background:var(--red);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.kicker{display:inline-block;background:var(--violet);color:#fff;border-radius:2rem;padding:.12rem 1rem;font-size:1.05rem;letter-spacing:.07em;text-transform:uppercase;align-self:flex-start}
h1,h2{margin:.3rem 0;font-weight:900;text-transform:uppercase;line-height:1.04}
h1{font-size:3.4rem} h2{font-size:2.3rem;color:var(--teal)}
.card{background:var(--card);border:.2rem solid var(--teal);border-radius:1.3rem;box-shadow:0 .35rem 0 var(--violet);padding:1rem 1.3rem}
.row{display:flex;gap:1.2rem}.grow{flex:1;min-width:0}
.big{font-size:1.6rem;line-height:1.25}
.y{color:var(--yellow)} .t{color:var(--teal)} .v{color:var(--violet2)}
.bubble{background:var(--yellow);color:#000;border-radius:1.2rem;padding:.6rem 1rem;font-size:1.25rem;position:relative}
.bubble::after{content:"";position:absolute;left:2rem;bottom:-.7rem;border:.7rem solid transparent;border-top-color:var(--yellow);border-bottom:0}
.fx{position:fixed;font-size:2.4rem;pointer-events:none;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}

/* title */
.hero{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:2rem;align-items:center}
.hero .logo{width:100%;max-height:48vh;object-fit:contain;filter:drop-shadow(0 0 1.2rem rgba(90,240,199,.45))}
.chips{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
.chip{border:.16rem solid var(--teal);border-radius:2rem;padding:.2rem 1rem;font-size:1.1rem}

/* plan */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:1rem;flex:1;min-height:0;margin:.6rem 0}
.step{display:flex;flex-direction:column;gap:.5rem;cursor:pointer;transition:.15s}
.step:hover{transform:translateY(-.3rem)}
.step.on{background:var(--card2);border-color:var(--yellow)}
.step .n{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-size:1.3rem;font-weight:900}
.step b{font-size:1.05rem;text-transform:uppercase;color:var(--teal)}
.step span{font-size:1rem;line-height:1.25;opacity:.9}
.step .em{font-size:2.2rem;line-height:1}

/* sort / quiz */
.q-top{display:flex;justify-content:space-between;align-items:center}
.q-text{font-size:2.1rem;font-weight:900;line-height:1.12;margin:.3rem 0 .7rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;flex:none}
.opt{display:flex;align-items:center;gap:.9rem;font:inherit;font-weight:900;font-size:1.5rem;text-align:left;color:#fff;padding:.55rem .9rem;border:.18rem solid var(--teal);border-radius:1.2rem;background:var(--card2);cursor:pointer;transition:.12s}
.opt:hover{transform:translateY(-.15rem);border-color:var(--yellow)}
.opt .l{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-size:1.5rem}
.opt.ok{background:var(--green);color:#000;border-color:#fff;animation:pulse .5s}
.opt.ok .l{background:#000;color:#fff}
.opt.no{background:var(--red);animation:shake .4s}
.opt.dim{opacity:.4}
.why{display:none;gap:1rem;align-items:center;margin-top:auto;padding-top:.5rem}
.why.show{display:flex}
.why .t2{font-size:1.3rem;line-height:1.2}
.side{width:15vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1.2rem;font-size:6rem;line-height:1}
.side .bubble{font-size:1.15rem}
.big-card{font-size:2.5rem;font-weight:900;text-align:center;padding:1rem;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;border:.22rem dashed var(--yellow);border-radius:1.4rem;background:#0f0a22;line-height:1.1}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.tri .opt{justify-content:center;text-align:center;font-size:1.35rem;flex-direction:column;gap:.2rem}
.tri .opt small{font-size:.9rem;opacity:.85;font-weight:700}

/* hunt */
.hunt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.2rem;flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.phone{margin:0 auto;height:100%;aspect-ratio:2/3;max-width:100%;background:#fff;color:#111;border-radius:1.6rem;border:.3rem solid var(--teal);box-shadow:0 .4rem 0 var(--violet);display:flex;flex-direction:column;overflow:hidden;font-size:.9rem}
.phone .hd{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;font-size:1rem}
.av{width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--teal));flex:none}
.photo{flex:1;min-height:0;background:linear-gradient(#bde6ff,#e8f7ff 60%,#9ad7a5 60%);position:relative;display:flex;align-items:flex-end;justify-content:center}
.photo .me{font-size:6.5rem;line-height:1;margin-bottom:.4rem}
.ticket{position:absolute;right:6%;top:20%;background:#fff;border:.15rem solid #111;border-radius:.4rem;padding:.25rem;width:4.8rem;text-align:center;font-size:.55rem;transform:rotate(6deg)}
.qr{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin:.15rem auto;width:3.4rem;height:3.4rem}
.qr i{background:#111}.qr i.w{background:#fff}
.badge{position:absolute;left:8%;top:25%;background:#fff;border:.15rem solid #111;border-radius:.4rem;padding:.1rem .35rem;font-size:.6rem;line-height:1.1;transform:rotate(-8deg)}
.cap{padding:.5rem .7rem;font-size:.9rem;line-height:1.25}
.hs{cursor:pointer;border-radius:.4rem;outline:.16rem dashed transparent;animation:blink 1.6s infinite}
@keyframes blink{50%{outline-color:#ff4d6d;background:rgba(255,77,109,.12)}}
.hs.found{animation:none;outline:.16rem solid var(--green);background:rgba(53,224,138,.25)}
.hs.sel{outline:.22rem solid var(--yellow)}
.info{display:flex;flex-direction:column;gap:.7rem;font-size:1.3rem;line-height:1.22;overflow:auto;min-height:0}
.info .bad{background:rgba(255,77,109,.18);border-left:.4rem solid var(--red);border-radius:.8rem;padding:.5rem .8rem}
.info .good{background:rgba(53,224,138,.16);border-left:.4rem solid var(--green);border-radius:.8rem;padding:.5rem .8rem}

/* matrix */
.mx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.2rem;flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.grid3{display:grid;grid-template-columns:2.2rem repeat(3,1fr);grid-template-rows:repeat(3,minmax(0,1fr)) 2.2rem;gap:.4rem}
.cell{border-radius:.8rem;display:flex;align-items:center;justify-content:center;gap:.2rem;font-size:2.2rem;border:.14rem solid rgba(255,255,255,.25)}
.ax{display:flex;align-items:center;justify-content:center;font-size:.95rem;letter-spacing:.05em;color:var(--teal)}
.ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.pick .opt{justify-content:center;font-size:1.05rem;padding:.3rem}
.pick .opt.sel{background:var(--yellow);color:#000;border-color:#fff}

/* final & tasks */
.table{width:100%;border-collapse:separate;border-spacing:.5rem;font-size:1.15rem}
.table th{background:var(--violet);padding:.4rem .6rem;border-radius:.6rem;font-size:1rem;text-transform:uppercase;text-align:left}
.table td{background:var(--card2);padding:.5rem .7rem;border-radius:.6rem;vertical-align:top}
.timer{font-family:"Courier New",monospace;font-size:3.6rem;font-weight:900;text-align:center;line-height:1;color:var(--yellow)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:1rem;flex:1;min-height:0;margin:.6rem 0}
.rule{display:flex;gap:1rem;align-items:center}
.rule .e{font-size:3.6rem}
.rule b{font-size:1.55rem;color:var(--teal);display:block;text-transform:uppercase}
.rule span{font-size:1.2rem;line-height:1.2}
</style>
</head>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (h) => { const t = document.createElement("div"); t.innerHTML = h.trim(); return t.firstElementChild; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function burst(x, y) {
  const em = ["⭐", "✨", "🔒", "🛡️", "💜", "🟡"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"); s.className = "fx"; s.textContent = pick(em);
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.random() * 500 - 250 + "px"); s.style.setProperty("--dy", -Math.random() * 360 - 60 + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}
const center = (e) => { const r = e.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
let right = 0, total = 0; const scoreEl = $("#score");
const addScore = (ok) => { total++; if (ok) right++; scoreEl.textContent = `⭐ ${right} / ${total}`; };
scoreEl.onclick = () => { if (confirm("Скинути рахунок групи?")) { right = total = 0; scoreEl.textContent = "⭐ 0 / 0"; } };

/* ---- універсальна вікторина ---- */
function quiz(root, o) {
  const items = o.items; let i = 0, locked = false, got = 0;
  const L = ["А", "Б", "В", "Г"];
  root.innerHTML = `<div class="q-top"><span class="kicker">${o.kicker}</span><span class="kicker" id="qc" style="background:var(--teal);color:#000"></span></div>
    <div class="row" style="flex:1;min-height:0;margin-top:.5rem">
      <div class="card grow" style="display:flex;flex-direction:column;min-height:0">
        <div class="q-text" id="qt"></div><div class="opts" id="qo"></div>
        <div class="why" id="qw"><div class="t2" id="qx"></div></div></div>
      <div class="side"><div class="bubble" id="qb">${o.host}</div><div id="qe">${o.emoji}</div></div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:.7rem"><button class="btn y" id="qn" disabled>Наступне ▶</button></div>`;
  const opts = $("#qo", root), why = $("#qw", root), nextBtn = $("#qn", root);
  function show() {
    locked = false; const it = items[i];
    $("#qc", root).textContent = `${i + 1} / ${items.length}`; $("#qt", root).innerHTML = it.q; opts.innerHTML = ""; why.classList.remove("show"); nextBtn.disabled = true;
    nextBtn.textContent = i === items.length - 1 ? "Результат ⭐" : "Наступне ▶"; $("#qe", root).textContent = o.emoji;
    it.o.forEach((t, k) => {
      const b = el(`<button class="opt"><span class="l">${L[k]}</span><span>${t}</span></button>`);
      b.onclick = () => {
        if (locked) return; locked = true; const ok = k === it.a; addScore(ok); if (ok) got++;
        $$(".opt", opts).forEach((x, j) => x.classList.add(j === it.a ? "ok" : j === k ? "no" : "dim"));
        $("#qx", root).innerHTML = (ok ? "✅ ВІРНО! " : "❌ Майже! ") + it.w; why.classList.add("show"); nextBtn.disabled = false;
        $("#qe", root).textContent = ok ? "🥳" : "🤔"; if (ok) burst(...center(b));
      };
      opts.appendChild(b);
    });
  }
  nextBtn.onclick = () => {
    if (i < items.length - 1) { i++; show(); return; }
    root.innerHTML = `<span class="kicker">${o.kicker}</span><div class="card" style="margin:.8rem 0;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem;text-align:center">
      <div style="font-size:3.2rem;font-weight:900" class="y">РЕЗУЛЬТАТ: ${got} / ${items.length}</div><div style="font-size:6rem">${got >= items.length - 1 ? "🏆" : got >= items.length / 2 ? "💪" : "📚"}</div>
      <div class="big">${got >= items.length - 1 ? "Блискуче! Ви вмієте аналізувати загрози!" : got >= items.length / 2 ? "Добре! Ще раз повторимо складні моменти." : "Повторимо разом — і буде краще!"}</div>
      <button class="btn y" id="again">↻ Ще раз</button></div>`;
    $("#again", root).onclick = () => quiz(root, o); burst(innerWidth / 2, innerHeight / 2);
  };
  show();
}

    <div class="steps">${S.map((s, i) => `<div class="card step" data-i="${i}"><div class="em">${s[0]}</div><div class="n">${i + 1}</div><b>${s[1]}</b><span>${s[2]}</span></div>`).join("")}</div>

  const D = ["Крок 1. Визначаємо, які дані є персональними, а які ні.", "Крок 2. Знаходимо слабкі місця у публікації: що саме видає особисте.", "Крок 3. Відносимо ситуації до типів: фішинг, витік, надмірний збір, необережність.", "Крок 4. Оцінюємо імовірність і наслідки на матриці ризиків.", "Крок 5. Підбираємо захист і заповнюємо власну таблицю аналізу."];
  $$(".step", r).forEach((s) => s.onclick = () => { $$(".step", r).forEach((x) => x.classList.remove("on")); s.classList.add("on"); $("#pl", r).textContent = D[s.dataset.i]; burst(...center(s)); });
});

add("Розминка", (r) => {
  const I = [["Прізвище, ім'я, по батькові", 0, "Прямо ідентифікує людину."], ["Номер телефону", 0, "Дає змогу зв'язатися з людиною й знайти її."], ["Колір улюбленої футболки", 2, "Саме по собі нікого не ідентифікує."], ["Відбиток пальця", 1, "Біометричні дані належать до особливих категорій."],
    ["Діагноз і стан здоров'я", 1, "Дані про здоров'я — особливі категорії, захищені суворіше."], ["Погода у Києві", 2, "Загальна інформація без зв'язку з людиною."], ["Фото обличчя", 0, "Зображення, за яким можна впізнати людину."], ["Релігійні чи політичні погляди", 1, "Особливі категорії: розкриття може зашкодити людині."]];
  let i = 0, locked = false, got = 0;
  r.innerHTML = `<span class="kicker">Крок 1 · Розминка</span>
    <div class="row" style="flex:1;min-height:0;margin-top:.5rem"><div class="card grow" style="display:flex;flex-direction:column;gap:.9rem;min-height:0">
      <div class="q-top"><b style="font-size:1.4rem" class="t">ЦЕ ПЕРСОНАЛЬНІ ДАНІ?</b><span id="sc" class="y" style="font-size:1.3rem"></span></div>
      <div class="big-card" id="it"></div>
      <div class="tri" id="tr"><button class="opt" data-k="0"><span>🟣 ЗВИЧАЙНІ ПД</span><small>ПІБ, телефон, фото</small></button><button class="opt" data-k="1"><span>🟡 ОСОБЛИВІ ПД</span><small>здоров'я, біометрія, віра</small></button><button class="opt" data-k="2"><span>⚪ НЕ ПЕРСОНАЛЬНІ</span><small>не ідентифікують людину</small></button></div>
      <div class="why" id="wy"><div class="t2" id="wt"></div></div></div>
      <div class="side"><div class="bubble" id="bb">Група голосує в чаті: 1, 2 чи 3?</div><div id="em">🧠</div></div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:.7rem"><button class="btn y" id="nx" disabled>Далі ▶</button></div>`;
  const f = (s) => $(s, r); const NAMES = ["ЗВИЧАЙНІ ПД", "ОСОБЛИВІ ПД", "НЕ ПЕРСОНАЛЬНІ"];
  function show() { locked = false; f("#sc").textContent = `${i + 1} / ${I.length}`; f("#it").textContent = I[i][0]; $$("#tr .opt", r).forEach((b) => b.className = "opt"); f("#wy").classList.remove("show"); f("#nx").disabled = true; f("#em").textContent = "🧠"; }
  $$("#tr .opt", r).forEach((b) => b.onclick = () => {
    if (locked) return; locked = true; const k = +b.dataset.k, ok = k === I[i][1]; addScore(ok); if (ok) got++;
    $$("#tr .opt", r).forEach((x) => x.classList.add(+x.dataset.k === I[i][1] ? "ok" : x === b ? "no" : "dim"));
    f("#wt").innerHTML = `${ok ? "✅ ВІРНО!" : "❌ Ні."} <b class="y">${NAMES[I[i][1]]}.</b> ${I[i][2]}`; f("#wy").classList.add("show"); f("#nx").disabled = false;
    f("#em").textContent = ok ? "🥳" : "🤔"; if (ok) burst(...center(b));
  });
  f("#nx").onclick = () => { if (i < I.length - 1) { i++; show(); } else { f("#it").innerHTML = `🏁 Правильно: ${got} з ${I.length}`; f("#wt").innerHTML = "Особливі категорії захищені суворіше: їх обробляють лише за чітких підстав."; f("#nx").disabled = true; burst(innerWidth / 2, innerHeight / 2); } };
  show();
});

    <div class="hunt" style="margin-top:.5rem">
      <div class="phone"><div class="hd"><div class="av"></div><div><b>andriy_k07</b><br><span class="hs" data-k="loc" style="font-size:.8rem">📍 Київ, зупинка «Ліцей»</span></div><span class="hs" data-k="open" style="margin-left:auto;font-size:.8rem">🔓 Відкритий</span></div>

    { q: "Приходить SMS: «Вашу посилку затримано, сплатіть 29 грн» з посиланням.", o: ["Фішинг і соціальна інженерія", "Технічний злам бази", "Надмірний збір даних", "Необережність користувача"], a: 0, w: "Це фішинг: обман, щоб отримати дані картки." },
    { q: "Інтернет-магазин зламали: база клієнтів із телефонами й адресами опинилась у мережі.", o: ["Необережність користувача", "Технічний злам і витік бази", "Фішинг", "Надмірний збір даних"], a: 1, w: "Зловмисники скористалися вразливістю серверів магазину." },
    { q: "Застосунок-ліхтарик просить доступ до контактів, камери й геолокації.", o: ["Фішинг", "Технічний злам", "Необережність користувача", "Надмірний збір даних і дозволи"], a: 3, w: "Для роботи ліхтарика такі дозволи не потрібні — це порушення принципу мінімізації." },
    { q: "Учень виклав у сторіз фото посадкового талона з QR-кодом.", o: ["Необережність користувача", "Технічний злам", "Фішинг", "Надмірний збір даних"], a: 0, w: "Людина сама оприлюднила свої дані: це типова помилка." },
    { q: "Дзвінок: «Я з банку. Назвіть код із SMS, щоб зберегти ваші гроші».", o: ["Надмірний збір даних", "Фішинг і соціальна інженерія", "Технічний злам", "Необережність користувача"], a: 1, w: "Шахраї тиснуть на емоції — це соціальна інженерія (вішинг)." },
    { q: "Той самий пароль в пошті, соцмережі та банку; старий сайт, де він був, зламали.", o: ["Фішинг", "Надмірний збір даних", "Необережність: повторне використання пароля", "Технічний злам вашого телефона"], a: 2, w: "Один витік відкриває всі акаунти з таким самим паролем." }
  ]
}));

/* 5. Матриця ризиків */
add("Оцінка ризику", (r) => {
  const T = [["Фішингова SMS про «посилку»", 2, 2], ["Витік бази інтернет-магазину", 1, 2], ["Застосунок із надмірними дозволами", 2, 1], ["Фото документа в загальному чаті", 0, 2], ["Публічний Wi-Fi без VPN", 1, 1]];
  const PL = ["Низька", "Середня", "Висока"], IL = ["Малі", "Середні", "Великі"], COL = ["#35e08a", "#ffd60a", "#ff4d6d"];
  let i = 0, p = null, im = null, done = false;
  r.innerHTML = `<span class="kicker">Крок 4 · Оцінка ризику</span>
    <div class="mx" style="margin-top:.5rem"><div class="card" style="display:flex;flex-direction:column;gap:.7rem;min-height:0">
      <div class="y" style="font-size:1.1rem"><span id="n"></span> · ЗАГРОЗА</div><div style="font-size:1.6rem;line-height:1.1" id="th"></div>
      <div class="t" style="font-size:.95rem">ІМОВІРНІСТЬ — як часто таке трапляється?</div><div class="pick" id="pp">${PL.map((x, k) => `<button class="opt" data-k="${k}">${x}</button>`).join("")}</div>
      <div class="t" style="font-size:.95rem">НАСЛІДКИ — наскільки серйозна шкода?</div><div class="pick" id="ip">${IL.map((x, k) => `<button class="opt" data-k="${k}">${x}</button>`).join("")}</div>
      <div class="why" id="wy"><div class="t2" id="wt" style="font-size:1.1rem"></div></div>
      <div style="display:flex;gap:.8rem;margin-top:auto;padding-top:.4rem"><button class="btn y" id="ck" disabled style="flex:1">✔ Показати оцінку</button><button class="btn" id="nx" disabled>▶</button></div></div>
      <div class="card" style="padding:.8rem;display:flex;flex-direction:column;gap:.4rem;min-height:0"><div class="grid3" id="g" style="flex:1;min-height:0"></div><div style="font-size:1rem;text-align:center">⭐ — ваш вибір · 🎯 — експертна оцінка (навчальна)</div></div></div>`;
  const f = (s) => $(s, r), g = f("#g");
  const lvl = (pi, ii) => pi + ii;
  function drawGrid() {
    g.innerHTML = "";
    for (let row = 2; row >= 0; row--) {
      g.appendChild(el(`<div class="ax v">${IL[row].toUpperCase()}</div>`));
      for (let c = 0; c < 3; c++) { const s = lvl(c, row); g.appendChild(el(`<div class="cell" data-c="${c}" data-r="${row}" style="background:${COL[s <= 1 ? 0 : s <= 2 ? 1 : 2]}66"></div>`)); }
    }
    g.appendChild(el("<div></div>")); PL.forEach((x) => g.appendChild(el(`<div class="ax">${x.toUpperCase()}</div>`)));
  }
  function show() { p = im = null; done = false; drawGrid(); f("#n").textContent = `${i + 1} / ${T.length}`; f("#th").textContent = T[i][0]; $$(".pick .opt", r).forEach((b) => b.className = "opt"); f("#wy").classList.remove("show"); f("#ck").disabled = true; f("#nx").disabled = true; f("#ck").style.display = ""; }
  $$("#pp .opt", r).forEach((b) => b.onclick = () => { if (done) return; $$("#pp .opt", r).forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); p = +b.dataset.k; f("#ck").disabled = p == null || im == null; });
  $$("#ip .opt", r).forEach((b) => b.onclick = () => { if (done) return; $$("#ip .opt", r).forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); im = +b.dataset.k; f("#ck").disabled = p == null || im == null; });
  f("#ck").onclick = () => {
    if (done) return; done = true; const [, ep, ei] = T[i]; const ok = p === ep && im === ei; addScore(ok);
    $(`.cell[data-c="${p}"][data-r="${im}"]`, g).innerHTML += "⭐"; $(`.cell[data-c="${ep}"][data-r="${ei}"]`, g).innerHTML += "🎯";
    const lev = ["НИЗЬКИЙ", "СЕРЕДНІЙ", "ВИСОКИЙ"][ep + ei <= 1 ? 0 : ep + ei <= 2 ? 1 : 2];
    f("#wt").innerHTML = `${ok ? "✅ ТОЧНО!" : "🎯 Експертна оцінка:"} імовірність <b class="y">${PL[ep]}</b>, наслідки <b class="y">${IL[ei]}</b> → ризик <b class="t">${lev}</b>.`;
    f("#wy").classList.add("show"); f("#ck").style.display = "none"; f("#nx").disabled = false; if (ok) burst(...center(f("#th")));
  };
  f("#nx").onclick = () => { if (i < T.length - 1) { i++; show(); } else { f("#wt").innerHTML = "🏁 Матриця заповнена! Найвищий ризик — висока імовірність + великі наслідки: цим загрозам приділяємо найбільше уваги."; f("#nx").disabled = true; burst(innerWidth / 2, innerHeight / 2); } };
  show();
});

/* 6. Контрзаходи */
add("Захист", (r) => quiz(r, {
  kicker: "Крок 5 · Обираємо захист", emoji: "🛡️", host: "Яка відповідь найкраща для кожної загрози?",
  items: [
    { q: "Фішингова SMS із посиланням. Що робимо?", o: ["Не переходимо за посиланням, перевіряємо в офіційному застосунку", "Переходимо й вводимо дані картки", "Пересилаємо друзям", "Відповідаємо на SMS"], a: 0, w: "Офіційні сервіси не просять дані картки через посилання з SMS." },
    { q: "Магазин, де ви купували, повідомив про витік. Перші дії?", o: ["Нічого не робимо", "Змінити пароль, увімкнути 2FA, перевірити інші акаунти", "Видалити телефон", "Закрити всі соцмережі"], a: 1, w: "Швидка зміна пароля й 2FA позбавляють зловмисників доступу." },
    { q: "Застосунок просить зайві дозволи. Як краще?", o: ["Дозволити все", "Продовжити без перевірки", "Вимкнути зайві дозволи або видалити застосунок", "Дати свій пароль"], a: 2, w: "Залишаємо лише потрібні дозволи — принцип мінімізації." },
    { q: "Потрібно зайти в банк із публічного Wi-Fi.", o: ["Просто увійти", "Використати VPN або мобільний інтернет і HTTPS", "Відкрити з чужого ноутбука", "Вимкнути блокування екрана"], a: 1, w: "VPN шифрує трафік, а мобільний інтернет безпечніший за відкриту мережу." },
    { q: "Як не повторювати один пароль скрізь?", o: ["Записати пароль на стікері", "Придумати один дуже складний", "Використовувати ім'я та рік народження", "Менеджер паролів + унікальні паролі + 2FA"], a: 3, w: "Менеджер паролів запам'ятає все за вас, а 2FA закриє двері навіть при витоку." }
  ]
}));

/* 7. Завдання */
add("Завдання", (r) => {
  const S = ["Реєстрація в застосунку доставки їжі", "Оплата в інтернет-магазині", "Фото з відпустки у відкритому акаунті", "Підключення до Wi-Fi у торговому центрі", "Заповнення онлайн-анкети на конкурс", "Скан паспорта для оформлення послуги", "Новий смарт-годинник із геолокацією"];
  r.innerHTML = `<span class="kicker">Самостійна частина · 15 хв</span><h2>ТВОЯ ТАБЛИЦЯ АНАЛІЗУ</h2>
    <div class="row" style="flex:1;min-height:0">
      <div class="card grow" style="display:flex;flex-direction:column;min-height:0;gap:.5rem">
        <div style="font-size:1.2rem;line-height:1.2">1️⃣ Обери <b class="y">3 ситуації</b> зі свого життя (або з 🎲).<br>2️⃣ Заповни таблицю: <b class="t">де дані → загроза → ризик → захист</b>.<br>3️⃣ Здай у Google Classroom.</div>
        <table class="table" style="font-size:1rem"><tr><th>Де мої дані</th><th>Загроза</th><th>Ризик</th><th>Як захищусь</th></tr>
          <tr><td>Фото з QR-квитком у сторіз</td><td>Необережність: копія QR</td><td class="y">Середній</td><td>Не публікувати квитки</td></tr>
          <tr><td>…</td><td>…</td><td>…</td><td>…</td></tr></table>
        <div class="card" style="background:var(--card2);margin-top:auto;font-size:1.1rem;line-height:1.2;padding:.6rem 1rem" id="dc">🎲 Не знаєш, що обрати? Натисни кубик справа — отримаєш випадкову ситуацію!</div></div>
      <div style="display:flex;flex-direction:column;gap:1rem;width:26vw"><div class="card" style="text-align:center"><div style="font-size:1.1rem">⏱ ТАЙМЕР</div><div class="timer" id="tm">15:00</div>
        <div style="display:flex;gap:.5rem;justify-content:center;margin-top:.6rem;flex-wrap:wrap"><button class="btn v" id="t10">10</button><button class="btn v" id="t15">15</button><button class="btn" id="tg">▶</button><button class="btn r" id="ts">⏸</button></div></div>
        <button class="btn y" id="dice" style="font-size:1.3rem;padding:.4em .6em">🎲 Випадкова ситуація</button></div></div>`;
  $("#dice", r).onclick = () => { $("#dc", r).innerHTML = `🎲 <b class="y">${pick(S)}</b><br><span style="font-size:.9rem;opacity:.85">Які дані? Яка загроза? Як захиститись?</span>`; burst(...center($("#dice", r))); };
  let sec = 900, tid = null; const draw = () => { $("#tm", r).textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; };
  const stop = () => { clearInterval(tid); tid = null; }; const setT = (m) => { stop(); sec = m * 60; draw(); };
  $("#t10", r).onclick = () => setT(10); $("#t15", r).onclick = () => setT(15); $("#ts", r).onclick = stop;
  $("#tg", r).onclick = () => { if (tid) return; tid = setInterval(() => { sec--; draw(); if (sec <= 0) { stop(); $("#tm", r).textContent = "ЧАС!"; burst(innerWidth / 2, innerHeight / 2); } }, 1000); };
});

/* 8. Підсумок */
add("Підсумок", (r) => {
  const R = [["🔍", "Знай, що ти публікуєш", "Геотег, QR, номери й документи — не для відкритого доступу."], ["🔐", "Унікальні паролі + 2FA", "Менеджер паролів і двофакторна автентифікація."], ["🧐", "Перевіряй, кому віддаєш дані", "Зайві дозволи й підозрілі посилання — стоп!"], ["📊", "Оцінюй ризик", "Імовірність × наслідки: захищай насамперед головне."]];
  r.innerHTML = `<span class="kicker">Підсумок практичної</span><h2>4 ЗОЛОТІ ПРАВИЛА</h2>
    <div class="rules">${R.map((x) => `<div class="card rule"><div class="e">${x[0]}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join("")}</div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center"><div class="big">⭐ Очки групи: <b class="y" id="fs"></b></div><div class="big">Дякую за роботу! 💜</div></div>`;
  $("#fs", r).textContent = `${right} / ${total}`; burst(innerWidth / 2, innerHeight / 3);
});

/* навігація */
const main = $("#main"), dots = $("#dots"); let cur = 0; const built = [];
scenes.forEach((s, i) => { const sec = document.createElement("section"); sec.className = "scene"; main.appendChild(sec); s.root = sec; const d = document.createElement("div"); d.className = "dot"; d.title = s.title; d.onclick = () => go(i); dots.appendChild(d); });
function go(i) {
  if (i < 0 || i >= scenes.length) return; cur = i;
  scenes.forEach((s, k) => s.root.classList.toggle("active", k === i)); $$(".dot").forEach((d, k) => { d.classList.toggle("on", k === i); d.classList.toggle("done", k < i); });
  if (!built[i] || i === scenes.length - 1) { scenes[i].build(scenes[i].root); built[i] = true; }
  $("#prev").disabled = i === 0; $("#next").disabled = i === scenes.length - 1;
}
$("#prev").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(cur + 1); else if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1);
  else if (/^[fFаА]$/.test(e.key)) { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (/^[rRкК]$/.test(e.key)) { scenes[cur].build(scenes[cur].root); }
});
go(0);
</script>
</body>
</html>
