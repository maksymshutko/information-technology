<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<script>/*clean-url*/(function(){if(location.protocol==="file:")return;var p=location.pathname,q=p.replace(/\/index\.html$/,"/").replace(/\.html$/,"");if(q!==p)history.replaceState(null,"",q+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Засоби захисту мереж — інтерактив</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1340; --white:#fff; --yellow:#ffd23f; --pink:#ff4d8d; --blue:#2ec4ff; --green:#2ee59d; --purple:#7a5cff; --orange:#ff8a3d; --red:#ff3b5c;
  --bg1:#7a5cff; --bg2:#ff4d8d;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,1.5vw,30px)}
body{margin:0;height:100vh;overflow:hidden;font-family:"Rubik","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));transition:background .6s;user-select:none}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.14);z-index:0;pointer-events:none}
body::before{width:42vw;height:42vw;left:-12vw;top:-16vw}
body::after{width:30vw;height:30vw;right:-8vw;bottom:-12vw}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:1.2vh 2vw}
header{display:flex;align-items:center;gap:1.5rem;height:8vh;color:#fff}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:.04em;text-shadow:0 .15rem 0 rgba(27,19,64,.35);white-space:nowrap}
.dots{flex:1;display:flex;gap:.6rem;justify-content:center}
.dot{width:1.1rem;height:1.1rem;border-radius:50%;background:rgba(255,255,255,.4);border:.18rem solid var(--ink);cursor:pointer;transition:.2s}
.dot.done{background:var(--yellow)}
.dot.on{background:#fff;transform:scale(1.5)}
.score{background:var(--yellow);border:.2rem solid var(--ink);border-radius:2rem;padding:.2rem 1.1rem;font-size:1.3rem;font-weight:900;box-shadow:0 .25rem 0 var(--ink);cursor:pointer;color:var(--ink)}
main{flex:1;position:relative;min-height:0}
.scene{display:none;height:100%;flex-direction:column;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.scene.active{display:flex}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(2vh)}to{opacity:1;transform:none}}
footer{display:flex;justify-content:space-between;align-items:center;height:9vh}
.btn{font:inherit;font-weight:900;font-size:1.3rem;color:var(--ink);background:#fff;border:.22rem solid var(--ink);border-radius:1.2rem;padding:.45em 1.2em;box-shadow:0 .35rem 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(.3rem);box-shadow:0 .05rem 0 var(--ink)}
.btn.y{background:var(--yellow)} .btn.g{background:var(--green)} .btn.r{background:var(--red);color:#fff} .btn.b{background:var(--blue)} .btn.p{background:var(--purple);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.kicker{display:inline-block;background:var(--ink);color:var(--yellow);border-radius:2rem;padding:.15rem 1rem;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start}
h1,h2{margin:.3rem 0;font-weight:900;text-transform:uppercase;line-height:1.02;color:#fff;text-shadow:0 .2rem 0 rgba(27,19,64,.5)}
h1{font-size:3.6rem} h2{font-size:2.5rem}
.card{background:#fff;border:.24rem solid var(--ink);border-radius:1.4rem;box-shadow:0 .4rem 0 var(--ink);padding:1rem 1.4rem}
.row{display:flex;gap:1.2rem}
.grow{flex:1;min-width:0}
.big{font-size:1.7rem;line-height:1.25}
.char{height:100%;width:auto;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-.5rem) rotate(1.5deg)}}
.char .eyes{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.char .flame{animation:flick .5s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.12,.9) rotate(3deg)}}
.char .m-sad{display:none}
.char[data-mood="sad"] .m-happy{display:none}
.char[data-mood="sad"] .m-sad{display:inline}
.char[data-mood="cheer"]{animation:cheer .5s infinite}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.2rem) scale(1.06)}}
.char[data-mood="shake"]{animation:shake .4s 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.bubble{position:relative;background:#fff;border:.22rem solid var(--ink);border-radius:1.2rem;padding:.6rem 1.1rem;font-size:1.35rem;box-shadow:0 .3rem 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:2rem;bottom:-1rem;width:1.4rem;height:1.4rem;background:#fff;border-right:.22rem solid var(--ink);border-bottom:.22rem solid var(--ink);transform:rotate(45deg)}
.bubble.left::after{left:auto;right:2rem}
.fx{position:fixed;font-size:2.4rem;pointer-events:none;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}

/* title */
.title-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5rem}
.team{display:flex;gap:1vw;flex:1;min-height:0;align-items:flex-end;margin-top:.3rem;min-width:0}
.team .c{height:92%;cursor:pointer;min-width:0;flex:0 1 auto}
.team .c svg{height:100%;max-width:100%}
.team .hk{height:100%;margin-right:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:1.1rem;cursor:pointer}
.team .hk svg{height:62%}

/* characters grid */
.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;flex:1;min-height:0;margin:.8rem 0}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.4rem;padding:.7rem;cursor:pointer;border-radius:1.4rem;border:.24rem solid var(--ink);background:rgba(255,255,255,.88);box-shadow:0 .4rem 0 var(--ink);transition:.15s;min-height:0}
.hero:hover{transform:translateY(-.3rem)}
.hero.on{background:var(--yellow);transform:translateY(-.5rem) scale(1.03)}
.hero .art{flex:1;min-height:0;display:flex;align-items:flex-end}
.hero b{font-size:1.25rem;text-transform:uppercase;text-align:center}
.hero small{font-size:.95rem;opacity:.8;font-weight:700}

/* quiz */
.q-top{display:flex;justify-content:space-between;align-items:center}
.q-text{font-size:2rem;font-weight:900;line-height:1.1;color:var(--ink);margin:.2rem 0 .6rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;flex:none}
.opt{display:flex;align-items:center;gap:1rem;font:inherit;font-weight:900;font-size:1.45rem;text-align:left;color:var(--ink);padding:.5rem .9rem;border:.24rem solid var(--ink);border-radius:1.3rem;background:#fff;box-shadow:0 .35rem 0 var(--ink);cursor:pointer;transition:.12s}
.opt:hover{transform:translateY(-.2rem)}
.opt .l{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;border:.2rem solid var(--ink);display:grid;place-items:center;font-size:1.5rem}
.opt.ok{background:var(--green);animation:pulse .5s}
.opt.no{background:var(--red);color:#fff;animation:shake .4s}
.opt.dim{opacity:.45}
@keyframes pulse{50%{transform:scale(1.04)}}
.why{display:none;gap:1rem;align-items:center;margin-top:auto;padding-top:.5rem}
.why.show{display:flex}
.why .av{height:11vh;flex:none}
.why .t{font-size:1.3rem;line-height:1.15}

/* firewall */
.fw{display:grid;grid-template-columns:1.1fr 1.3fr;grid-template-rows:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.rules{padding:.8rem 1.1rem;font-size:1.1rem}
.rules h3{margin:.1rem 0 .4rem;font-size:1.4rem;text-transform:uppercase}
.rules li{list-style:none;margin:.25rem 0;padding:.25rem .5rem;border-radius:.6rem;border:.15rem solid transparent;font-size:1.05rem}
.rules li.hit{border-color:var(--ink);background:var(--yellow)}
.pill{display:inline-block;padding:0 .5rem;border-radius:.5rem;color:#fff;font-weight:900}
.pill.a{background:#10b981}.pill.d{background:var(--red)}
.packet{padding:1rem 1.4rem;font-size:1.7rem}
.packet .from{display:flex;align-items:center;justify-content:space-between;gap:.8rem;font-size:1.65rem}
.packet .tag{background:var(--blue);border:.18rem solid var(--ink);border-radius:.8rem;padding:.1rem .7rem;font-size:1.3rem}
.stage{display:flex;align-items:flex-end;justify-content:space-between;flex:1;min-height:0;gap:1rem;padding-top:.4rem}
.stage .who{height:100%;flex:none}
.stage .env{font-size:5rem;transition:transform .6s,opacity .6s}
.env.go{transform:translateX(12vw);opacity:0}
.env.stop{transform:translateX(-4vw) rotate(-20deg);opacity:.2}

/* hunt */
.hunt{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.map{position:relative;padding:0;background:#e9f7ff;overflow:hidden}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);font:inherit;border:.22rem solid var(--ink);background:#fff;border-radius:1.2rem;padding:.2rem .8rem;box-shadow:0 .3rem 0 var(--ink);cursor:pointer;text-align:center;font-weight:900;font-size:1.05rem}
.hot .e{display:block;font-size:2.8rem;line-height:1.1}
.hot::after{content:"?";position:absolute;right:-.8rem;top:-.8rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--red);color:#fff;border:.15rem solid var(--ink);font-size:1.1rem;line-height:1.4rem;animation:pulse 1.2s infinite}
.hot.fixed{background:var(--green)}
.hot.fixed::after{content:"✓";background:#fff;color:#0a7a52;animation:none}
.hot.sel{outline:.3rem solid var(--yellow)}
.info{font-size:1.35rem;line-height:1.22;display:flex;flex-direction:column;gap:.6rem;overflow:auto}
.info .bad{background:#ffe3e8;border-radius:1rem;padding:.5rem .8rem}
.info .good{background:#d9fff0;border-radius:1rem;padding:.5rem .8rem}

/* layers */
.layers{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.layers svg{height:100%;width:100%;max-height:100%}
.ring{transform-origin:300px 300px;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .4s;transform:scale(.3);opacity:0}
.ring.vis{transform:scale(1);opacity:1}
.lyr{font-size:1.2rem;display:flex;gap:.7rem;align-items:center;margin:.25rem 0}
.lyr i{font-style:normal;font-size:2rem}

/* password */
.pw{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.pwbox{font-family:"Courier New",monospace;font-size:3.3rem;text-align:center;padding:1.3rem .5rem;border:.28rem dashed var(--ink);border-radius:1.4rem;background:#fff9d6;word-break:break-all;line-height:1.15}
.meter{height:2rem;border:.22rem solid var(--ink);border-radius:2rem;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .8s,background .4s}

/* vpn */
.vpn{flex:1;min-height:0;display:flex;flex-direction:column;gap:1rem}
.track{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:12% 1fr 12%;align-items:center;gap:.5rem}
.node{text-align:center;font-size:1.3rem;line-height:1.1}
.node span{display:block;font-size:5rem}
.pipe{position:relative;height:100%}
.pipe .line{position:absolute;left:0;right:0;top:62%;height:1.2rem;border-radius:1rem;background:#fff;border:.2rem solid var(--ink)}
.tunnel{position:absolute;left:3%;right:3%;top:calc(62% - 1.2rem);height:3.6rem;border-radius:2rem;background:repeating-linear-gradient(45deg,#ffd23f,#ffd23f 14px,#ffb703 14px,#ffb703 28px);border:.22rem solid var(--ink);opacity:0;transition:opacity .4s}
[data-vpn=on] .tunnel{opacity:1}
.pkt{position:absolute;top:calc(62% - .9rem);left:0;font-family:"Courier New",monospace;font-size:1.2rem;background:#fff;border:.18rem solid var(--ink);border-radius:.7rem;padding:.1rem .6rem;animation:mv 5s linear infinite;white-space:nowrap}
.pkt:nth-child(5){animation-delay:-1.7s}.pkt:nth-child(6){animation-delay:-3.4s}
@keyframes mv{from{left:0}to{left:calc(100% - 9rem)}}
.pkt .enc{display:none;background:var(--ink);color:var(--green);padding:0 .2rem}
[data-vpn=on] .pkt .enc{display:inline}[data-vpn=on] .pkt .plain{display:none}
.spy{position:absolute;left:50%;top:-4%;transform:translateX(-50%);height:46%;display:flex;gap:1rem;align-items:flex-end}
.spy .bubble{margin-bottom:2rem;font-size:1.3rem}

/* final */
.final{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.final>*{min-width:0}
.timer{font-family:"Courier New",monospace;font-size:4.6rem;font-weight:900;text-align:center;line-height:1}
.final li{margin:.25rem 0;font-size:1.15rem;line-height:1.15}
.cheer{display:flex;gap:.5vw;height:15vh;align-items:flex-end;margin-top:.5rem;min-width:0}
.cheer .c{height:100%;min-width:0;flex:1}
.cheer .c svg{height:100%;width:100%}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🛡️ ЗАХИСТ МЕРЕЖ · ІНТЕРАКТИВ</div>
    <div class="dots" id="dots"></div>
    <div class="score" id="score" title="Клік — скинути рахунок">⭐ 0 / 0</div>
  </header>
  <main id="main"></main>
  <footer>
    <button class="btn" id="prev">◀ Назад</button>
    <div style="color:#fff;font-size:1.1rem;text-shadow:0 .1rem 0 rgba(27,19,64,.5)">стрілки ← → · клавіша <b>F</b> — на весь екран · <b>R</b> — заново</div>
    <button class="btn y" id="next">Далі ▶</button>
  </footer>
</div>

<script>
"use strict";
const INK = "#1b1340";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (html) => { const t = document.createElement("div"); t.innerHTML = html.trim(); return t.firstElementChild; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

/* ---------- персонажі (SVG) ---------- */
const eyes = (a, b, y, r = 14) => `<g class="eyes"><circle cx="${a}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${b}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${a + 2}" cy="${y + 2}" r="${r * .45}" fill="${INK}"/><circle cx="${b + 2}" cy="${y + 2}" r="${r * .45}" fill="${INK}"/></g>`;
const mouth = (x, y, w = 16) => `<path class="m-happy" d="M${x - w} ${y} Q${x} ${y + w * 1.7} ${x + w} ${y} Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><g class="m-sad"><path d="M${x - w * .8} ${y + w * .8} Q${x} ${y - w * .5} ${x + w * .8} ${y + w * .8}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M${x + w * 1.8} ${y - w * 2.4} q-7 11 0 15 q7 -4 0 -15z" fill="#5ad1ff" stroke="${INK}" stroke-width="3"/></g>`;
const wrap = (inner, mood = "happy") => `<svg class="char" data-mood="${mood}" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">${inner}</svg>`;
const S = `stroke="${INK}" stroke-width="5"`;

const CH = {
  fire: () => wrap(`
    <path class="flame" d="M100 4 C124 28 134 42 122 66 C114 55 107 52 100 58 C93 52 86 55 78 66 C66 42 88 28 100 4Z" fill="#ffb703" ${S}/>
    <path class="flame" d="M100 30 C108 42 112 50 106 60 C103 56 101 55 100 56 C99 55 97 56 94 60 C88 50 94 42 100 30Z" fill="#fff3a0"/>
    <rect x="36" y="64" width="128" height="138" rx="10" fill="#ff6b3d" ${S}/>
    <g stroke="#ffd2b8" stroke-width="4" fill="none"><path d="M36 98H164M36 134H164M36 170H164"/><path d="M82 64V98M122 98V134M82 134V170M122 170V202M60 98V134M60 170V202M104 134V170M140 64V98"/></g>
    ${eyes(78, 122, 120, 15)}${mouth(100, 154, 18)}
    <rect x="8" y="112" width="34" height="22" rx="11" fill="#ff6b3d" ${S}/><rect x="158" y="112" width="34" height="22" rx="11" fill="#ff6b3d" ${S}/>
    <circle cx="176" cy="100" r="18" fill="#ff3b5c" ${S}/><text x="176" y="107" font-size="20" text-anchor="middle" font-weight="900" fill="#fff" stroke="none">✋</text>
    <rect x="56" y="200" width="30" height="14" rx="6" fill="${INK}"/><rect x="114" y="200" width="30" height="14" rx="6" fill="${INK}"/>`),
  vpn: () => wrap(`
    <path d="M100 52V28" fill="none" ${S}/><circle cx="100" cy="22" r="9" fill="#2ee59d" ${S}/>
    <rect x="42" y="50" width="116" height="152" rx="58" fill="#7a5cff" ${S}/>
    <rect x="58" y="92" width="40" height="28" rx="11" fill="${INK}"/><rect x="102" y="92" width="40" height="28" rx="11" fill="${INK}"/><path d="M98 102H102" ${S} fill="none"/>
    <path d="M66 100l10 -3M110 100l10 -3" stroke="#fff" stroke-width="4" fill="none"/>
    ${mouth(100, 142, 16)}
    <rect x="72" y="160" width="56" height="36" rx="9" fill="#ffd23f" ${S}/><circle cx="100" cy="174" r="7" fill="${INK}"/><rect x="97" y="177" width="6" height="12" fill="${INK}"/>
    <rect x="10" y="118" width="36" height="22" rx="11" fill="#7a5cff" ${S}/><rect x="154" y="118" width="36" height="22" rx="11" fill="#7a5cff" ${S}/>`),
  av: () => wrap(`
    <path d="M100 14 L174 42 V110 C174 160 138 194 100 212 C62 194 26 160 26 110 V42 Z" fill="#2ee59d" ${S}/>
    <path d="M100 32 L158 54 V108 C158 148 130 176 100 192 C70 176 42 148 42 108 V54 Z" fill="#a6ffd8"/>
    <path d="M100 52v22M89 63h22" stroke="#fff" stroke-width="8" fill="none"/><path d="M100 52v22M89 63h22" ${S} stroke-width="2" fill="none" opacity=".0"/>
    ${eyes(76, 124, 108, 16)}${mouth(100, 148, 20)}
    <path d="M60 86q16 -10 30 0M110 86q16 -10 30 0" fill="none" ${S}/>`),
  owl: () => wrap(`
    <path d="M46 72 L56 26 L86 56Z M154 72 L144 26 L114 56Z" fill="#ffb703" ${S}/>
    <ellipse cx="100" cy="128" rx="64" ry="80" fill="#ffb703" ${S}/>
    <ellipse cx="100" cy="156" rx="40" ry="48" fill="#ffe08a"/>
    <circle cx="74" cy="94" r="27" fill="#fff" ${S}/><circle cx="126" cy="94" r="27" fill="#fff" ${S}/>
    <circle class="eyes" cx="78" cy="98" r="12" fill="${INK}"/><circle class="eyes" cx="130" cy="98" r="12" fill="${INK}"/>
    <path d="M100 106 L86 126 L114 126Z" fill="#ff8a3d" ${S}/>
    ${mouth(100, 142, 11)}
    <circle cx="160" cy="152" r="22" fill="#bff0ff" fill-opacity=".8" ${S}/><path d="M176 168 L194 190" ${S} stroke-width="10" fill="none"/>
    <rect x="62" y="204" width="28" height="12" rx="6" fill="#ff8a3d" ${S}/><rect x="110" y="204" width="28" height="12" rx="6" fill="#ff8a3d" ${S}/>`),
  beaver: () => wrap(`
    <ellipse cx="38" cy="190" rx="28" ry="13" transform="rotate(-22 38 190)" fill="#7a4a22" ${S}/>
    <circle cx="56" cy="60" r="18" fill="#b8743a" ${S}/><circle cx="144" cy="60" r="18" fill="#b8743a" ${S}/>
    <ellipse cx="100" cy="130" rx="64" ry="76" fill="#b8743a" ${S}/><ellipse cx="100" cy="164" rx="38" ry="40" fill="#f0c28a"/>
    ${eyes(78, 122, 100, 13)}<ellipse cx="100" cy="122" rx="13" ry="9" fill="${INK}"/>
    <rect x="88" y="132" width="24" height="26" rx="5" fill="#fff" ${S}/><path d="M100 132V158" ${S} stroke-width="3" fill="none"/>
    <path class="m-happy" d="M84 126 Q100 140 116 126" fill="none" ${S}/><g class="m-sad"><path d="M50 96 q-7 11 0 15 q7 -4 0 -15z" fill="#5ad1ff" stroke="${INK}" stroke-width="3"/></g>
    <rect x="124" y="150" width="52" height="48" rx="7" fill="#2ec4ff" ${S}/><rect x="134" y="152" width="32" height="18" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="146" y="176" width="14" height="22" fill="${INK}"/>
    <text x="150" y="166" font-size="13" font-weight="900" text-anchor="middle" fill="${INK}" stroke="none">3-2-1</text>`),
  hacker: () => wrap(`
    <path d="M26 214 Q26 126 100 122 Q174 126 174 214Z" fill="#3b2a7a" ${S}/>
    <path d="M44 96 Q36 18 100 20 Q164 18 156 96 Q150 48 100 48 Q50 48 44 96Z" fill="#3b2a7a" ${S}/>
    <circle cx="100" cy="86" r="42" fill="#ffd7b5" ${S}/>

function setMood(root, mood, ms = 1400) {
  const svgs = root.matches && root.matches(".char") ? [root] : $$(".char", root);

}
function burst(x, y, set) {
  const em = set || ["⭐", "🎉", "✨", "🛡️", "💥"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "fx"; s.textContent = pick(em);
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.random() * 500 - 250 + "px");
    s.style.setProperty("--dy", -Math.random() * 360 - 60 + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}

function quiz(root, o) {
  const items = o.items; let i = 0, locked = false, got = 0;

  root.innerHTML = `<div class="q-top"><span class="kicker">${o.kicker}</span><span class="kicker" id="qc"></span></div>

        <div class="why" id="qw"><div class="av" id="qa"></div><div class="t" id="qx"></div></div>
      </div>
      <div style="width:17vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">

  const q = $("#qt", root), opts = $("#qo", root), why = $("#qw", root), nextBtn = $("#qn", root);
  function show() {
    locked = false; const it = items[i];
    $("#qc", root).textContent = `${i + 1} / ${items.length}`;
    q.innerHTML = it.q; opts.innerHTML = ""; why.classList.remove("show"); nextBtn.disabled = true;
    nextBtn.textContent = i === items.length - 1 ? "Результат ⭐" : "Наступне ▶";
    it.o.forEach((t, k) => {
      const b = el(`<button class="opt"><span class="l" style="background:${COL[k]}">${L[k]}</span><span>${t}</span></button>`);
      b.onclick = () => {
        if (locked) return; locked = true;
        const ok = k === it.a; addScore(ok); if (ok) got++;
        $$(".opt", opts).forEach((x, j) => { if (j === it.a) x.classList.add("ok"); else if (j === k) x.classList.add("no"); else x.classList.add("dim"); });
        $("#qa", root).innerHTML = CH[it.char || o.char]();
        $("#qx", root).innerHTML = (ok ? "✅ ВІРНО! " : "❌ Майже! ") + it.w;

        if (ok) burst(...center(b));
      };
      opts.appendChild(b);
    });

    if (i < items.length - 1) { i++; show(); return; }
    root.innerHTML = `<span class="kicker">${o.kicker}</span><div class="card" style="margin:1rem 0;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem">

  };

}

  $("#fs", r).textContent = `${right} / ${total}`;

/* ---------- навігація ---------- */
const main = $("#main"), dots = $("#dots"); let cur = 0; const built = [];
scenes.forEach((s, i) => {
  const sec = document.createElement("section"); sec.className = "scene"; main.appendChild(sec); s.root = sec;
  const d = document.createElement("div"); d.className = "dot"; d.title = s.title; d.onclick = () => go(i); dots.appendChild(d);
});
function go(i) {
  if (i < 0 || i >= scenes.length) return; cur = i;
  scenes.forEach((s, k) => s.root.classList.toggle("active", k === i));
  $$(".dot").forEach((d, k) => { d.classList.toggle("on", k === i); d.classList.toggle("done", k < i); });
  const s = scenes[i]; document.body.style.setProperty("--bg1", s.bg[0]); document.body.style.setProperty("--bg2", s.bg[1]);
  if (!built[i] || i === scenes.length - 1) { s.build(s.root); built[i] = true; }
  $("#prev").disabled = i === 0; $("#next").disabled = i === scenes.length - 1;
}
$("#prev").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(cur + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1);
  else if (e.key === "f" || e.key === "F" || e.key === "а" || e.key === "А") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === "r" || e.key === "R" || e.key === "к" || e.key === "К") { const s = scenes[cur]; s.build(s.root); }
});
go(0);
</script>
